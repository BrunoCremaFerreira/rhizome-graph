<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rhizome-graph — live agent activity</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <!--
      The bottom row, laid out as ONE grid rather than as three boxes each
      pinned to the page: left caption, centred observed root, right git
      status. Positioned independently they overlapped at every realistic
      viewport -- the shortcut legend ran under the root path by 276px at
      1600 and buried it whole at 960 -- because nothing related their
      widths. Here each box owns a track, so growing content wraps inside
      its own cell instead of reaching into a neighbour's.
    -->
    <div id="bottom-bar">
      <div id="hud">
        <ol id="log"></ol>
        <div id="attribution" hidden></div>
        <div class="about">
          rhizome-graph · Gource-style live view
          <span class="keys">
            scroll: zoom · drag: pan · double-click: auto-fit · click: open file · ctrl+F: search ·
            ctrl+shift+F: search in files · F3: next · F7: size colours · ctrl+L: root
          </span>
        </div>
      </div>
      <div id="context">
        <span id="context-root"></span><span id="context-branch" hidden></span>
      </div>
      <div id="status" hidden>
        <div class="head"><span class="title">git status</span><span id="status-count"></span></div>
        <ol id="status-list"></ol>
      </div>
    </div>
    <!--
      The alarm panel (attention rules), top-left. It may NOT join #bottom-bar
      for the same reason #size-legend may not: that row is one grid whose two
      side reserves were measured in a browser, so a fourth box there would
      change what the centre caption may spend with nothing on screen saying so.
      Empty here and filled by attentionHud.ts, which shows it only while
      something is actually wearing an alarm.
    -->
    <div id="attention" hidden>
      <div class="head">
        <span class="title">attention</span>
        <span id="attention-count"></span>
        <button id="attention-clear" type="button" title="dismiss every alarm">
          clear
        </button>
      </div>
      <div id="attention-rules"></div>
      <ol id="attention-list"></ol>
    </div>
    <div id="search" hidden>
      <input
        id="search-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="search file or folder"
      />
      <span id="search-count"></span>
    </div>
    <!--
      Same slot as #search, which is safe because only one search is armed at a
      time. The label is what tells them apart: two identical boxes in one place
      with different behaviours is worse than either.
    -->
    <div id="content-search" hidden>
      <span class="label">in files</span>
      <input
        id="content-search-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="text to find in files"
      />
      <span id="content-search-count"></span>
    </div>
    <div id="root-bar" hidden>
      <div class="row">
        <span class="prompt">root</span>
        <input
          id="root-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="directory to observe"
        />
      </div>
      <div id="root-matches" hidden></div>
      <div id="root-error" hidden></div>
    </div>
    <!--
      The top-right column: the size legend (F7) and the session summary (F8),
      laid out against EACH OTHER rather than each against the page. Neither may
      join #bottom-bar -- that row is one grid whose two side reserves were
      measured in a browser, so a fourth box there would change what the centre
      caption may spend with nothing on screen saying so -- and pinning both to
      the same corner would overlap them totally for as long as F7 is armed,
      since #size-legend has no max-height and its error row is a string the
      daemon supplies. The legend is FIRST: the box that has always owned this
      corner does not move, and the newcomer absorbs the variability.
    -->
    <div id="top-right-column">
      <!-- Empty here and filled by sizeHud.ts, only while the mode is armed. -->
      <div id="size-legend" hidden></div>
      <!--
        Empty here and filled by statsHud.ts, which shows it only while F8 has
        it open AND the daemon has reported at least one agent.
      -->
      <div id="session-stats" hidden>
        <div class="head">
          <span class="title">session</span>
          <span id="session-stats-count"></span>
        </div>
        <div id="session-stats-note"></div>
        <ol id="session-stats-list"></ol>
      </div>
    </div>
    <div id="file-view" hidden>
      <div id="file-view-backdrop"></div>
      <div id="file-view-panel">
        <div id="file-view-head">
          <span id="file-view-path"></span>
          <span id="file-view-mode"></span>
          <span id="file-view-lang"></span>
          <span id="file-view-truncated" hidden></span>
          <button id="file-view-close" type="button" aria-label="close" title="close (esc)">×</button>
        </div>
        <pre id="file-view-body"></pre>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
